media:
  - name: photos
    label: Project photos
    input: images
    output: images
    categories: [image]
    extensions: [jpg, jpeg, png, webp, gif, apng, svg, avif]
    actions:
      - name: delete-project-photo-folder
        label: Delete project photo folder
        workflow: delete-photo-folder.yml
        ref: current
        confirm:
          title: Delete project photo folder?
          message: This permanently deletes the folder and all its files. It can only be deleted when no project uses its photos.
          button: Delete folder
        fields:
          - name: folder
            label: Folder name under Project 2026
            type: text
            required: true

content:
  - name: projects
    label: Projects
    type: collection
    path: data/projects
    format: json
    filename: "{title}.json"
    view:
      fields: [title, maker, featured]
      primary: title
      sort: [title]
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Project
        type: string
        required: true
      - name: maker
        label: Maker(s)
        type: string
        required: true
      - name: categories
        label: Categories
        type: string
        required: true
        list:
          min: 1
        description: >-
          Add one or more categories for this project (e.g. Robotics,
          Electronics & Hardware, Science & Sensors). Type a new name to
          create a category; it shows up on the site automatically. Avoid
          putting a comma inside a single category name.
      - name: featured
        label: Featured
        type: boolean
        default: false
      - name: overview
        label: Overview
        type: text
        required: true
      - name: scope
        label: Scope
        type: text
        required: true
      - name: materials
        label: Materials
        type: text
        required: true
      - name: fabricationSteps
        label: Fabrication Steps
        type: text
        required: true
      - name: outcome
        label: Outcome
        type: text
        required: true
      - name: photos
        label: Project photos
        type: image
        required: true
        options:
          media: photos
          multiple:
            max: 30
          unique: true
        description: >-
          Upload JPG/JPEG, PNG, WebP, GIF, APNG, SVG, or AVIF images up to
          20 MiB each. Create a new folder for the project when the upload
          dialog asks where to save, then select all of that folder's photos
          here. Name one photo "Cover" (for example Cover.jpg) so it appears
          first on the site; otherwise the first photo alphabetically is used.
      - name: notes
        label: Notes
        type: text
      - name: order
        label: false
        type: number
        hidden: true
        readonly: true
    operations:
      delete: true

  - name: footer
    label: Footer
    type: file
    path: data/footer.json
    format: json
    fields:
      - name: donorStatement
        label: Donor statement
        type: text
        required: true
        description: >-
          Shown at the bottom of every page. Wrap a name or phrase in
          **double asterisks** to make it bold, e.g. **Nancy and Mike
          Abrams '77**.

settings:
  commit:
    identity: user
