media:
  - name: photos
    label: Project photos
    input: images
    output: images
    categories: [image]
    extensions: [jpg, jpeg, png, webp, gif, apng, svg, avif]
    actions:
      - name: delete-project-photo-folder
        label: Delete project photo folder
        workflow: delete-photo-folder.yml
        ref: current
        confirm:
          title: Delete project photo folder?
          message: This permanently deletes the folder and all its files. It can only be deleted when no project uses its photos.
          button: Delete folder
        fields:
          - name: folder
            label: Folder name under Project 2026
            type: text
            required: true

content:
  - name: projects
    label: Projects
    description: Add, edit, or remove showcase projects. Changes appear on the site after the automatic rebuild (about a minute).
    type: collection
    path: data/projects
    format: json
    filename: "{title}.json"
    view:
      fields: [title, maker, categories, featured]
      primary: title
      sort: [title]
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Project title
        type: string
        required: true
        description: The name shown on the project card.
      - name: maker
        label: Maker(s)
        type: string
        required: true
        description: Who built it, e.g. "Jane Doe, John Smith".
      - name: categories
        label: Categories
        type: string
        required: true
        list:
          min: 1
        description: >-
          Add one or more categories for this project (e.g. Robotics,
          Electronics & Hardware, Science & Sensors). Type a new name to
          create a category; it shows up on the site automatically. Avoid
          putting a comma inside a single category name.
      - name: featured
        label: Show in Featured carousel
        type: boolean
        default: false
        description: Turn on to also show this project in the Featured carousel at the top of the site.
      - name: overview
        label: Overview
        type: text
        required: true
        description: One or two sentences summarizing the project. Shown on the front of the card.
      - name: scope
        label: Scope
        type: text
        required: true
        description: What the project set out to do. Shown on the front of the card.
      - name: materials
        label: Materials
        type: text
        required: true
        description: Parts and materials used. Put each item on its own line starting with a bullet (•).
      - name: fabricationSteps
        label: Fabrication Steps
        type: text
        required: true
        description: How it was built. Put each step on its own line, numbered (1. 2. 3.).
      - name: outcome
        label: Outcome
        type: text
        required: true
        description: What was achieved and what was learned.
      - name: coverPhoto
        label: Cover photo
        type: image
        required: true
        options:
          media: photos
          unique: true
        description: >-
          Required. The main photo, shown first on the card and in the
          Featured carousel. Upload it to a new folder for this project
          (the upload dialog asks where to save), or choose an existing one.
          JPG, PNG, WebP, GIF, APNG, SVG, or AVIF up to 20 MiB.
      - name: photos
        label: More photos
        type: image
        options:
          media: photos
          multiple:
            max: 30
          unique: true
        description: >-
          Optional extra photos, shown after the cover. Save them in the same
          folder as the cover photo.
      - name: notes
        label: Notes (not shown on the site)
        type: text
        description: Optional internal notes for the team.
      - name: order
        label: false
        type: number
        hidden: true
        readonly: true
    operations:
      delete: true

  - name: footer
    label: Footer
    type: file
    path: data/footer.json
    format: json
    fields:
      - name: donorStatement
        label: Donor statement
        type: text
        required: true
        description: >-
          Shown at the bottom of every page. Wrap a name or phrase in
          **double asterisks** to make it bold, e.g. **Nancy and Mike
          Abrams '77**.

settings:
  commit:
    identity: user
