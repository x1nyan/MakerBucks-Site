name: Build projects CSV

on:
  push:
    paths:
      - 'data/projects/*.json'
      - 'scripts/showcase_data.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild CSV
        run: python scripts/showcase_data.py build

      - name: Commit generated CSV
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if git diff --ignore-space-at-eol --quiet -- MakerBucks_Database.csv; then
            echo "MakerBucks_Database.csv is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MakerBucks_Database.csv
          git commit -m "chore: rebuild project CSV"
          git fetch origin "$BRANCH_NAME"
          git rebase "origin/$BRANCH_NAME"
          git push origin "HEAD:$BRANCH_NAME"