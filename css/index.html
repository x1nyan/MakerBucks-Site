<!DOCTYPE html>
<!--
  =====================================================================
  MAKERBUCKS SHOWCASE (index.html) — the page the site runs from
  =====================================================================

  From top to bottom the page shows:
    1. Title card        (photo from images/title-card.jpg)
    2. Featured Projects (side-scrolling row of projects marked TRUE
                          in the sheet's Featured column)
    3. Search / filter / sort bar
    4. The grid of all projects

  The code is split into a few files so each one stays readable:

    index.html          this file: the page structure (HTML only)

    css/cards.css       shared: colors, cards, flip view, photos
    css/showcase.css    title card, search/filter bar, and the grid
    css/featured.css    the Featured Projects row

    js/config.js        THE GOOGLE SHEET LINK (edit this one)
    js/cards.js         building cards, flip view, loading the sheet
    js/featured.js      the Featured Projects row + its arrows
    js/showcase.js      search, filters, sort, and the grid

  How it runs:
    At the bottom of this file the scripts load IN ORDER:
      config.js   -> sets up the sheet link
      cards.js    -> adds the shared card tools
      featured.js -> fills the Featured row
      showcase.js -> fills the main grid
    config.js and cards.js must come first, because the other two
    use what they set up. The sheet is only downloaded once; both
    sections share the same data.

  To edit the content, edit the Google Sheet — not these files.
  To point at a different sheet, paste its link into js/config.js.
  =====================================================================
-->
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MakerBucks Showcase</title>

  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/showcase.css">
  <link rel="stylesheet" href="css/featured.css">
</head>

<body>

  <!-- =========================================================
     TITLE CARD
     The image is read from this repo: images/title-card.jpg
     (the path is relative to this HTML file). To use a different
     image, replace that file, or change the src below.
     If the image is missing, the card still shows with a dark
     background (onerror hides the broken-image icon).
     ========================================================= -->

  <header class="title-card">
    <img class="title-card-img" src="images/title-card.jpg" alt=""
      onerror="this.style.display='none'">
    <div class="title-card-text">
      <h1>MakerBucks Showcase</h1>
      <p>Student projects built with WPI MakerBucks funding</p>
    </div>
  </header>


  <!-- =========================================================
     FEATURED PROJECTS
     Filled in by js/featured.js with every project marked TRUE
     in the sheet's Featured column. Hides itself if none are.
     ========================================================= -->

  <section class="featured-section" id="featuredSection" aria-labelledby="featuredTitle">
    <div class="featured-head">
      <div>
        <h2 class="featured-title" id="featuredTitle">★ Featured Projects</h2>
        <p class="featured-sub" id="featuredSub">Click a project to see how it was made</p>
      </div>

      <div class="scroll-btns" id="scrollBtns" hidden>
        <button class="scroll-btn" id="scrollPrev" type="button" aria-label="Scroll to previous projects">&#10094;</button>
        <button class="scroll-btn" id="scrollNext" type="button" aria-label="Scroll to more projects">&#10095;</button>
      </div>
    </div>

    <div class="featured-track" id="featuredTrack">
      <div class="loading">Loading featured projects…</div>
    </div>
  </section>


  <!-- =========================================================
     CONTROLS
     ========================================================= -->

  <div class="controls">
    <div class="search-row">
      <div class="search-wrap">
        <input type="text" id="searchInput" class="search-input"
          placeholder="Search by project, maker, category, or keyword..." aria-label="Search projects">
        <button class="search-clear" id="searchClearBtn" type="button" aria-label="Clear search">&times;</button>
      </div>

      <!-- Filter dropdown: button + hidden panel of checkboxes.
           The category checkboxes are added by JavaScript once the
           sheet loads (inside #categoryOptions), using whatever
           categories are in the sheet's Category column. -->
      <div class="filter-dropdown" id="filterDropdown">
        <button class="filter-toggle" id="filterToggle" type="button"
          aria-haspopup="true" aria-expanded="false" aria-controls="filterPanel">
          <span id="filterToggleLabel">Filter: All categories</span>
          <span class="filter-caret" aria-hidden="true">▼</span>
        </button>

        <div class="filter-panel" id="filterPanel" hidden>
          <label class="filter-option">
            <input type="checkbox" id="featuredCheckbox">
            ★ Featured only
          </label>
          <div class="filter-divider"></div>
          <div id="categoryOptions"></div>
        </div>
      </div>

      <select id="sortSelect" class="sort-select" aria-label="Sort projects">
        <option value="detail">Sort: Most detailed first</option>
        <option value="featured">Sort: Featured first</option>
        <option value="az">Sort: A → Z</option>
        <option value="za">Sort: Z → A</option>
        <option value="maker">Sort: Maker A → Z</option>
      </select>

      <button class="clear-filters-btn" id="clearFiltersBtn" type="button">Clear filters</button>
    </div>
  </div>


  <!-- =========================================================
     RESULTS
     ========================================================= -->

  <p class="results-summary" id="resultsSummary" aria-live="polite"></p>
  <p class="swipe-hint">Swipe sideways to see more projects →</p>

  <div class="project-grid" id="projectContainer">
    <div class="loading" id="loadingState">Loading projects…</div>
  </div>

  <div class="no-results" id="noResultsState">
    No matching projects found.
    Try a different search term, or
    <button class="clear-filters-btn visible" id="noResultsClearBtn" type="button">clear your filters</button>.
  </div>

  <!-- Scripts: order matters (see the note at the top of this file) -->
  <script src="js/config.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/featured.js"></script>
  <script src="js/showcase.js"></script>

</body>

</html>
