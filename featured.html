<!DOCTYPE html>
<!--
  =====================================================================
  MAKERBUCKS — FEATURED PROJECTS (featured.html)
  =====================================================================

  A separate page that shows ONLY the projects marked TRUE in the
  sheet's Featured column, in a row you scroll side to side. It uses
  the same cards and the same sheet link as index.html (see the file
  list at the top of index.html).

  Scripts load in this order at the bottom:
    config.js -> cards.js -> featured.js
  =====================================================================
-->
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Featured MakerBucks Projects</title>

  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/featured.css">
</head>

<body>


  <!-- =========================================================
     FEATURED PROJECTS
     ========================================================= -->

  <section class="featured-section" aria-labelledby="featuredTitle">
    <div class="featured-head">
      <div>
        <h2 class="featured-title" id="featuredTitle">★ Featured Projects</h2>
        <p class="featured-sub" id="featuredSub">Click a project to see how it was made</p>
      </div>

      <div class="scroll-btns" id="scrollBtns" hidden>
        <button class="scroll-btn" id="scrollPrev" type="button" aria-label="Scroll to previous projects">&#10094;</button>
        <button class="scroll-btn" id="scrollNext" type="button" aria-label="Scroll to more projects">&#10095;</button>
      </div>
    </div>

    <div class="featured-track" id="featuredTrack">
      <div class="loading">Loading featured projects…</div>
    </div>
  </section>

  <!-- Scripts: order matters -->
  <script src="js/config.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/featured.js"></script>

</body>

</html>
