<!DOCTYPE html>
<!--
  =====================================================================
  MAKERBUCKS SHOWCASE (index.html) — the page the site runs from
  =====================================================================

  From top to bottom the page shows:
    1. Header             (centered logo, site links, theme switch)
    2. Banner             (rotating photo and title)
    3. Featured Projects  (side-scrolling row marked TRUE in the CSV)
    4. Search / filter / sort controls
    5. Main project grid  (three desktop columns, vertical on phones)

  The code is split into a few files so each one stays readable:

    index.html          this file: the page structure (HTML only)

    css/cards.css       shared: colors, cards, flip view, photos
    css/showcase.css    title banner, search/filter bar, and the grid
    css/featured.css    the Featured Projects row

    js/theme.js         applies and saves the light/dark theme
    js/config.js        SETTINGS: generated CSV path + banner images
    js/project-data.js  embedded CSV fallback for file:// or fetch failure
    js/banner.js        fills in the title banner
    js/cards.js         building cards, flip view, loading the CSV
    js/featured.js      the Featured Projects row + its arrows
    js/showcase.js      search, filters, sort, and the grid

  Data workflow:
    Pages CMS edits one JSON file per project in data/projects/.
    A GitHub Action regenerates MakerBucks_Database.csv for the site.
    Do not edit the generated CSV directly.

  Scripts in the head load theme.js before the stylesheets. The scripts
  at the bottom load config.js, project-data.js, logo.js, banner.js,
  cards.js, featured.js, then showcase.js. Both project sections share
  the cached CSV load from cards.js.

  Project photos live in the folder named by each form's Image Folder Path.
  =====================================================================
-->
<html lang="en" data-theme="light">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WPI MakerBucks Showroom</title>

  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/showcase.css">
  <link rel="stylesheet" href="css/featured.css">
</head>

<body>

  <!-- =========================================================
     TITLE BANNER
     The photo, logo, and title are set in js/config.js (BANNER)
     and filled in by js/banner.js — edit config.js to change them.
     ========================================================= -->

  <div class="site-header">
    <nav class="header-links" aria-label="MakerBucks links">
      <a class="header-link" href="https://www.wpi.edu/about/ie/%20innovation-studio/makerspace/makerbucks"
        target="_blank" rel="noopener noreferrer">WPI Site</a>
      <a class="header-link" href="https://forms.cloud.microsoft/pages/responsepage.aspx?id=9XacWBXK-UGIS1XsFaBnKriU7R5-K7pMspHSlPPbjQlUQlJMWVBYSDBQS001TUlRVk9GSFUyMVBKRy4u&amp;route=shorturl"
        target="_blank" rel="noopener noreferrer">Apply today</a>
      <a class="header-link" id="projectSubmissionLink" target="_blank"
        rel="noopener noreferrer" hidden>Submit a project</a>
    </nav>
    <img class="site-logo" id="siteLogo" alt="" hidden>
    <button class="theme-toggle" id="themeToggle" type="button" role="switch"
      aria-label="Dark theme" aria-checked="false" title="Switch to dark theme">
      <span class="theme-toggle-icon" aria-hidden="true">&#9728;</span>
      <span class="theme-toggle-thumb" aria-hidden="true"></span>
      <span class="theme-toggle-icon" aria-hidden="true">&#9790;</span>
    </button>
  </div>

  <header class="banner">
    <img class="banner-img" id="bannerImg" alt="">
    <h1 class="banner-title" id="bannerTitle">WPI MakerBucks Showroom</h1>
  </header>


  <!-- =========================================================
     FEATURED PROJECTS
     Filled in by js/featured.js with every project marked TRUE
    in the generated CSV's Featured column. Hides if none are.
     ========================================================= -->

  <section class="featured-section" id="featuredSection" aria-labelledby="featuredTitle">
    <div class="featured-head">
      <div>
        <h2 class="featured-title" id="featuredTitle">★ Featured Projects</h2>
        <p class="featured-sub">Click a project to see how it was made</p>
      </div>

      <div class="scroll-btns" id="scrollBtns" hidden>
        <button class="scroll-btn" id="scrollPrev" type="button" aria-label="Scroll to previous projects">&#10094;</button>
        <button class="scroll-btn" id="scrollNext" type="button" aria-label="Scroll to more projects">&#10095;</button>
      </div>
    </div>

    <div class="featured-track" id="featuredTrack">
      <div class="loading">Loading featured projects…</div>
    </div>
  </section>


  <!-- =========================================================
     CONTROLS
     ========================================================= -->

  <div class="controls">
    <div class="search-row">
      <div class="search-wrap">
        <input type="text" id="searchInput" class="search-input"
          placeholder="Search by project, maker, category, or keyword..." aria-label="Search projects">
        <button class="search-clear" id="searchClearBtn" type="button" aria-label="Clear search">&times;</button>
      </div>

       <!-- Filter dropdown: button + hidden panel of checkboxes.
         JavaScript fills #categoryOptions from generated CSV values. -->
      <div class="filter-dropdown" id="filterDropdown">
        <button class="filter-toggle" id="filterToggle" type="button"
          aria-haspopup="true" aria-expanded="false" aria-controls="filterPanel">
          <span id="filterToggleLabel">Filter: All categories</span>
          <span class="filter-caret" aria-hidden="true">▼</span>
        </button>

        <div class="filter-panel" id="filterPanel" hidden>
          <label class="filter-option">
            <input type="checkbox" id="featuredCheckbox">
            ★ Featured only
          </label>
          <div class="filter-divider"></div>
          <div id="categoryOptions"></div>
        </div>
      </div>

      <select id="sortSelect" class="sort-select" aria-label="Sort projects">
        <option value="detail">Sort: Most detailed first</option>
        <option value="featured">Sort: Featured first</option>
        <option value="az">Sort: A → Z</option>
        <option value="za">Sort: Z → A</option>
        <option value="maker">Sort: Maker A → Z</option>
      </select>

      <button class="clear-filters-btn" id="clearFiltersBtn" type="button">Clear filters</button>
    </div>
  </div>


  <!-- =========================================================
     RESULTS
     ========================================================= -->

  <p class="results-summary" id="resultsSummary" aria-live="polite"></p>
  <p class="swipe-hint">Swipe sideways to see more projects →</p>

  <div class="project-grid" id="projectContainer">
    <div class="loading">Loading projects…</div>
  </div>

  <div class="no-results" id="noResultsState">
    No matching projects found.
    Try a different search term, or
    <button class="clear-filters-btn visible" id="noResultsClearBtn" type="button">clear your filters</button>.
  </div>

  <!-- Scripts: order matters (see the note at the top of this file) -->
  <script src="js/config.js"></script>
  <script src="js/project-data.js"></script>
  <script src="js/logo.js"></script>
  <script src="js/banner.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/featured.js"></script>
  <script src="js/showcase.js"></script>

</body>

</html>
